name: pichel

services:

  backend:
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    image: ${DOCKERHUB_USERNAME}/pichel-backend:latest
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    networks:
      - data
      - front
    restart: unless-stopped
    volumes:
      - /var/lib/pichel/uploads:/app/uploads

  certbot:
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    image: certbot/certbot
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

  db:
    env_file: .env
    healthcheck:
      interval: 3s
      retries: 10
      test: ["CMD-SHELL", "pg_isready -U pichel -d pichel"]
      timeout: 5s
    image: postgres:18-alpine
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    networks:
      - data
    restart: unless-stopped
    volumes:
      - /var/lib/pichel/pg-data:/var/lib/postgresql

  frontend:
    depends_on:
      - backend
    image: ${DOCKERHUB_USERNAME}/pichel-frontend:latest
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    networks:
      edge:
        aliases:
          - pichel-frontend
      front:
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/pichel/uploads:/usr/share/nginx/html/uploads:ro
      - certbot-www:/var/www/certbot:ro

networks:
  data:
    internal: true
  edge:
    external: true
    name: pichel_edge
  front:

volumes:
  certbot-www:
