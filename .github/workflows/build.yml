name: Build and Deploy

on:
  push:
    branches: [master]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-api:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pichel_api:latest

  build-web:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pichel_web:latest

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: [build-api, build-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: docker-compose.prod.yml,infra/pichel.service,infra/pichel-nginx-reload.service,infra/pichel-nginx-reload.timer
          target: /opt/pichel/
          mkdir: true

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cat > /opt/pichel/.env <<'EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            PORT=${{ secrets.PORT }}
            COOKIE_SECURE=${{ secrets.COOKIE_SECURE }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            RUST_LOG=${{ secrets.RUST_LOG }}
            EOF
            cp /opt/pichel/infra/pichel.service /etc/systemd/system/pichel.service
            cp /opt/pichel/infra/pichel-nginx-reload.service /etc/systemd/system/pichel-nginx-reload.service
            cp /opt/pichel/infra/pichel-nginx-reload.timer /etc/systemd/system/pichel-nginx-reload.timer
            systemctl daemon-reload
            systemctl enable pichel
            systemctl enable pichel-nginx-reload.timer
            docker compose -f /opt/pichel/docker-compose.prod.yml pull
            systemctl restart pichel
            systemctl enable --now pichel-nginx-reload.timer
            docker image prune -f
