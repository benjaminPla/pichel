services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       gordo
      POSTGRES_USER:     gordo
      POSTGRES_PASSWORD: gordo
    ports:
      - "5432:5432"
    volumes:
      - /tmp/gordo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gordo -d gordo"]
      interval: 3s
      timeout: 5s
      retries: 10

  # ── API (future: built image) ─────────────────────────────────────────────
  # api:
  #   image: gordo-api:latest
  #   environment:
  #     DATABASE_URL: postgres://gordo:gordo@db:5432/gordo
  #     JWT_SECRET:   change-me
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     db:
  #       condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
