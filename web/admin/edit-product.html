<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar producto — Admin Pichel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="layout-admin">

  <aside class="sidebar" id="sidebar">
    <a href="/admin/" class="sidebar-brand">Pichel <small>ADMIN</small></a>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/admin/">
        <span class="icon">📋</span> Pedidos
      </a>
      <a class="nav-item active" href="/admin/products.html">
        <span class="icon">📦</span> Productos
      </a>
      <a class="nav-item" href="/admin/users.html">
        <span class="icon">👤</span> Usuarios
      </a>
      <a class="nav-item" href="/" target="_blank" rel="noopener" style="margin-top:auto">
        <span class="icon">🛒</span> Ver tienda
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></button>
      <span class="topbar-title">Editar producto</span>
    </div>
    <div class="content">
      <div class="form-card">
        <form id="prod-form" style="display:flex;flex-direction:column;gap:var(--sp-4)">

          <div>
            <label for="p-name">Nombre *</label>
            <input id="p-name" type="text" maxlength="100" required />
          </div>

          <div>
            <label for="p-desc">Descripción</label>
            <textarea id="p-desc" maxlength="255" rows="3"></textarea>
          </div>

          <div>
            <label for="p-salemode">Modalidad *</label>
            <select id="p-salemode" class="form-select" required>
              <option value="">— Seleccionar —</option>
              <option value="bulk">A granel</option>
              <option value="unit">Unidad</option>
            </select>
          </div>

          <div>
            <label for="p-price">Precio * <small id="p-price-note" style="display:none;font-weight:normal;color:var(--clr-text-muted)">(por kg)</small></label>
            <input id="p-price" type="number" min="0.01" step="0.01" required />
          </div>

          <div>
            <label for="p-symbols">Símbolos</label>
            <select id="p-symbols" class="form-select" multiple style="height:160px">
              <option value="vegan">🌱 Vegano</option>
              <option value="vegetarian">🥕 Vegetariano</option>
              <option value="gluten_free">🌾 Sin TACC</option>
              <option value="lactose_free">🥛 Sin lactosa</option>
              <option value="organic">🌿 Orgánico</option>
              <option value="sugar_free">🍃 Sin azúcar agregada</option>
              <option value="contains_nuts">🥜 Contiene frutos secos</option>
              <option value="high_protein">💪 Alto en proteína</option>
              <option value="no_added_salt">🧂 Sin sal agregada</option>
            </select>
          </div>

          <div>
            <label for="p-img">URL de imagen</label>
            <input id="p-img" type="text" placeholder="/images/products/nombre.webp" />
          </div>

          <div style="display:flex;gap:var(--sp-3)">
            <button class="btn btn-primary" type="submit" id="submit-btn">Guardar cambios</button>
            <a class="btn btn-ghost" href="/admin/">Cancelar</a>
          </div>

        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';
    let productId = null;

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch(`${API}/auth/logout`, { method: 'POST' });
      window.location.href = '/login.html';
    });

    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast show ${type}`;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }

    document.getElementById('p-salemode').addEventListener('change', () => {
      const mode = document.getElementById('p-salemode').value;
      document.getElementById('p-price-note').style.display = mode === 'bulk' ? '' : 'none';
    });

    async function loadProduct(id) {
      const res = await fetch(`${API}/products/${id}`);
      if (res.status === 401) { window.location.href = '/login.html'; return; }
      if (!res.ok) { window.location.href = '/admin/'; return; }
      const p = await res.json();
      document.getElementById('p-name').value     = p.name;
      document.getElementById('p-desc').value     = p.description || '';
      document.getElementById('p-salemode').value = p.sale_mode;
      document.getElementById('p-price').value    = (p.price_cents / 100).toFixed(2);
      document.getElementById('p-img').value      = p.image_url || '';
      document.getElementById('p-price-note').style.display = p.sale_mode === 'bulk' ? '' : 'none';
      Array.from(document.getElementById('p-symbols').options).forEach(o => {
        o.selected = p.symbols.includes(o.value);
      });
    }

    document.getElementById('prod-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name        = document.getElementById('p-name').value.trim();
      const description = document.getElementById('p-desc').value.trim() || null;
      const sale_mode   = document.getElementById('p-salemode').value;
      const price_cents = Math.round(parseFloat(document.getElementById('p-price').value) * 100);
      const symbols     = Array.from(document.getElementById('p-symbols').selectedOptions).map(o => o.value);
      const image_url   = document.getElementById('p-img').value.trim() || null;

      if (!name || !sale_mode || isNaN(price_cents) || price_cents < 1) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled    = true;
      btn.textContent = '…';

      try {
        const res = await fetch(`${API}/products/${productId}`, {
          method:  'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ name, description, sale_mode, price_cents, symbols, image_url }),
        });
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (!res.ok) { toast('Error al guardar', 'error'); return; }
        window.location.href = '/admin/';
      } catch { toast('Error del servidor', 'error'); }
      finally   { btn.disabled = false; btn.textContent = 'Guardar cambios'; }
    });

    async function init() {
      const params = new URLSearchParams(window.location.search);
      productId = params.get('id');
      if (!productId) { window.location.href = '/admin/'; return; }
      const authRes = await fetch(`${API}/users?page=1&per_page=1`);
      if (authRes.status === 401) { window.location.href = '/login.html'; return; }
      await loadProduct(productId);
    }

    init();
  </script>
</body>
</html>
