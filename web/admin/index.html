<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Pichel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="layout-admin">

  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-brand">Pichel <small>ADMIN</small></a>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-page="products" data-label="Productos">
        <span class="icon">📦</span> Productos
      </a>
      <a class="nav-item" data-page="users" data-label="Usuarios">
        <span class="icon">👤</span> Usuarios
      </a>
      <a class="nav-item" href="/" target="_blank" rel="noopener" style="margin-top:auto">
        <span class="icon">🛒</span> Ver lista de precios
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar-title" id="topbar-title">Productos</span>
    </div>
    <div class="content" id="content"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';

    // ── Bootstrap ─────────────────────────────────────────────────

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch(`${API}/auth/logout`, { method: 'POST' });
      window.location.href = '/login.html';
    });

    const navItems = document.querySelectorAll('.nav-item[data-page]');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        document.getElementById('topbar-title').textContent = item.dataset.label || '';
        document.getElementById('sidebar').classList.remove('open');
        renderPage(item.dataset.page);
      });
    });

    // ── Helpers ───────────────────────────────────────────────────

    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast show ${type}`;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }

    async function apiFetch(path, opts = {}) {
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (res.status === 401) { window.location.href = '/login.html'; return res; }
      return res;
    }

    function fmtCents(cents) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(cents / 100);
    }

    const SYMBOL_DEFS = {
      vegan:         { icon: '🌱', name: 'Vegano'                },
      vegetarian:    { icon: '🥕', name: 'Vegetariano'           },
      gluten_free:   { icon: '🌾', name: 'Sin TACC'              },
      lactose_free:  { icon: '🥛', name: 'Sin lactosa'           },
      organic:       { icon: '🌿', name: 'Orgánico'              },
      sugar_free:    { icon: '🍃', name: 'Sin azúcar agregada'   },
      contains_nuts: { icon: '🥜', name: 'Contiene frutos secos' },
      high_protein:  { icon: '💪', name: 'Alto en proteína'      },
      no_added_salt: { icon: '🧂', name: 'Sin sal agregada'      },
    };

    function symbolPills(symbols) {
      if (!symbols || !symbols.length) return '<span style="color:var(--clr-text-muted)">—</span>';
      return symbols.map(s => {
        const def = SYMBOL_DEFS[s];
        return def
          ? `<span class="pl-sym" title="${def.name}" style="font-size:1rem">${def.icon}</span>`
          : `<span style="font-size:var(--text-xs);color:var(--clr-text-muted)">${s}</span>`;
      }).join(' ');
    }

    function saleModeBadge(mode) {
      if (mode === 'bulk')    return `<span class="badge badge-bulk">A granel</span>`;
      if (mode === 'package') return `<span class="badge badge-pkg">Envasado</span>`;
      return `<span class="badge">${mode}</span>`;
    }

    function paginationBar(page, totalPages, loadFn) {
      if (totalPages <= 1) return '';
      return `
        <div class="pagination">
          <button class="pagination-btn" onclick="${loadFn}(${page - 1})" ${page <= 1 ? 'disabled' : ''}>← Anterior</button>
          <span class="pagination-info">Página ${page} de ${totalPages}</span>
          <button class="pagination-btn" onclick="${loadFn}(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>Siguiente →</button>
        </div>`;
    }

    // ── Pages ──────────────────────────────────────────────────────

    function renderPage(page) {
      const content = document.getElementById('content');
      if (page === 'products') return renderProducts(content);
      if (page === 'users')    return renderUsers(content);
    }

    // ── Products ──────────────────────────────────────────────────

    let editingProductId = null;

    async function renderProducts(el) {
      editingProductId = null;

      el.innerHTML = `
        <div class="form-card">
          <div class="section-header" style="padding:0;margin-bottom:var(--sp-5)">
            <h2 id="prod-form-title">Agregar producto</h2>
          </div>

          <form id="prod-form">
            <div class="form-2col">

              <div class="form-2col-row">
                <div class="form-2col-field">
                  <label for="p-name">Nombre *</label>
                  <input id="p-name" type="text" maxlength="100" required placeholder="ej. Avena integral" />
                </div>
                <div class="form-2col-hint">
                  <strong>Nombre del producto.</strong>
                  Máximo 100 caracteres. Sé específico: incluí el tipo o variedad si corresponde.
                </div>
              </div>

              <div class="form-2col-row">
                <div class="form-2col-field">
                  <label for="p-desc">Descripción</label>
                  <textarea id="p-desc" maxlength="255" rows="3" placeholder="ej. Producida en San Luis, sin aditivos"></textarea>
                </div>
                <div class="form-2col-hint">
                  <strong>Descripción breve.</strong>
                  Opcional. Máximo 255 caracteres. Aparece debajo del nombre en la lista de precios.
                </div>
              </div>

              <div class="form-2col-row">
                <div class="form-2col-field">
                  <label for="p-salemode">Modalidad de venta *</label>
                  <select id="p-salemode" class="form-select" required>
                    <option value="">— Seleccionar —</option>
                    <option value="bulk">A granel</option>
                    <option value="package">Envasado</option>
                  </select>
                </div>
                <div class="form-2col-hint">
                  <strong>¿Cómo se vende?</strong>
                  <em>A granel:</em> el cliente pide la cantidad que necesita y se pesa en el momento.<br>
                  <em>Envasado:</em> unidades cerradas — paquete, bolsa, caja, botella.
                </div>
              </div>

              <div class="form-2col-row">
                <div class="form-2col-field">
                  <label for="p-price">Precio (centavos) *</label>
                  <input id="p-price" type="number" min="1" step="1" required placeholder="ej. 420" />
                </div>
                <div class="form-2col-hint">
                  <strong>Precio de venta en centavos.</strong>
                  $4,20 → escribir <strong>420</strong>. Para a granel, es el precio por la unidad de medida elegida.
                </div>
              </div>

              <div class="form-2col-row">
                <div class="form-2col-field">
                  <label for="p-unit">Unidad de medida *</label>
                  <select id="p-unit" class="form-select" required>
                    <option value="">— Seleccionar —</option>
                    <option value="g">g — gramos</option>
                    <option value="kg">kg — kilogramos</option>
                    <option value="ml">ml — mililitros</option>
                    <option value="l">l — litros</option>
                    <option value="unit">unidad</option>
                  </select>
                </div>
                <div class="form-2col-hint">
                  <strong>Unidad de referencia para el precio.</strong>
                  Para a granel: el peso o volumen en que se expresa el precio.<br>
                  Para envasados: usar <em>unidad</em>.
                </div>
              </div>

              <div class="form-2col-row">
                <div class="form-2col-field">
                  <label for="p-symbols">Símbolos</label>
                  <select id="p-symbols" class="form-select" multiple style="height:160px">
                    <option value="vegan">🌱 Vegano</option>
                    <option value="vegetarian">🥕 Vegetariano</option>
                    <option value="gluten_free">🌾 Sin TACC</option>
                    <option value="lactose_free">🥛 Sin lactosa</option>
                    <option value="organic">🌿 Orgánico</option>
                    <option value="sugar_free">🍃 Sin azúcar agregada</option>
                    <option value="contains_nuts">🥜 Contiene frutos secos</option>
                    <option value="high_protein">💪 Alto en proteína</option>
                    <option value="no_added_salt">🧂 Sin sal agregada</option>
                  </select>
                </div>
                <div class="form-2col-hint">
                  <strong>Características del producto.</strong>
                  Seleccioná una o más. Usá <strong>Ctrl+clic</strong> (o <strong>Cmd+clic</strong> en Mac) para elegir varias. Se muestran como íconos en la lista de precios.
                </div>
              </div>

              <div class="form-2col-row">
                <div class="form-2col-field">
                  <label for="p-img">URL de imagen</label>
                  <input id="p-img" type="text" placeholder="/images/products/nombre.webp" />
                </div>
                <div class="form-2col-hint">
                  <strong>Imagen del producto.</strong>
                  Ruta relativa al servidor. Dejalo vacío si no hay imagen disponible.
                </div>
              </div>

            </div>

            <div style="display:flex;gap:var(--sp-3)">
              <button class="btn btn-primary" type="submit" id="prod-submit-btn">Agregar producto</button>
              <button class="btn btn-ghost" type="button" id="prod-cancel-btn" style="display:none" onclick="cancelProductEdit()">Cancelar</button>
            </div>
          </form>
        </div>

        <div class="section-header" style="padding:0;margin-bottom:var(--sp-4)">
          <h2>Todos los productos</h2>
          <span id="prod-count" class="text-muted"></span>
        </div>
        <div class="table-wrap" id="prod-table-wrap">Cargando…</div>`;

      await loadProductsAdmin();

      document.getElementById('prod-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name            = document.getElementById('p-name').value.trim();
        const description     = document.getElementById('p-desc').value.trim() || null;
        const sale_mode       = document.getElementById('p-salemode').value;
        const price_cents     = parseInt(document.getElementById('p-price').value);
        const unit_of_measure = document.getElementById('p-unit').value;
        const symbols         = Array.from(document.getElementById('p-symbols').selectedOptions).map(o => o.value);
        const image_url       = document.getElementById('p-img').value.trim() || null;

        if (!name || !sale_mode || !unit_of_measure || isNaN(price_cents) || price_cents < 1) return;

        const btn      = document.getElementById('prod-submit-btn');
        const original = btn.textContent;
        btn.disabled   = true;
        btn.textContent = '…';

        try {
          const body = { name, description, sale_mode, price_cents, unit_of_measure, symbols, image_url };
          const res  = editingProductId
            ? await apiFetch(`/products/${editingProductId}`, { method: 'PATCH', body: JSON.stringify(body) })
            : await apiFetch('/products', { method: 'POST', body: JSON.stringify(body) });

          if (!res || !res.ok) { toast(editingProductId ? 'Error al actualizar' : 'Error al crear el producto', 'error'); return; }
          toast(editingProductId ? 'Producto actualizado' : 'Producto agregado');
          cancelProductEdit();
          await loadProductsAdmin();
        } catch { toast('Error del servidor', 'error'); }
        finally   { btn.disabled = false; btn.textContent = original; }
      });

      document.getElementById('prod-table-wrap').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action="edit-product"]');
        if (!btn) return;
        startEditProduct({
          id:              btn.dataset.id,
          name:            btn.dataset.name,
          description:     btn.dataset.description,
          sale_mode:       btn.dataset.salemode,
          unit_of_measure: btn.dataset.unit,
          price_cents:     parseInt(btn.dataset.price),
          image_url:       btn.dataset.image,
          symbols:         btn.dataset.symbols ? btn.dataset.symbols.split(',') : [],
        });
      });
    }

    function cancelProductEdit() {
      editingProductId = null;
      document.getElementById('prod-form-title').textContent  = 'Agregar producto';
      document.getElementById('p-name').value                 = '';
      document.getElementById('p-desc').value                 = '';
      document.getElementById('p-salemode').value             = '';
      document.getElementById('p-price').value                = '';
      document.getElementById('p-unit').value                 = '';
      Array.from(document.getElementById('p-symbols').options).forEach(o => o.selected = false);
      document.getElementById('p-img').value                  = '';
      document.getElementById('prod-submit-btn').textContent  = 'Agregar producto';
      document.getElementById('prod-cancel-btn').style.display = 'none';
    }

    function startEditProduct(p) {
      editingProductId = p.id;
      document.getElementById('prod-form-title').textContent  = 'Editar producto';
      document.getElementById('p-name').value                 = p.name;
      document.getElementById('p-desc').value                 = p.description || '';
      document.getElementById('p-salemode').value             = p.sale_mode || '';
      document.getElementById('p-price').value                = p.price_cents;
      document.getElementById('p-unit').value                 = p.unit_of_measure || '';
      Array.from(document.getElementById('p-symbols').options).forEach(o => {
        o.selected = p.symbols.includes(o.value);
      });
      document.getElementById('p-img').value                  = p.image_url || '';
      document.getElementById('prod-submit-btn').textContent  = 'Guardar cambios';
      document.getElementById('prod-cancel-btn').style.display = '';
      document.getElementById('prod-form-title').scrollIntoView({ behavior: 'smooth' });
    }

    const PROD_PER_PAGE = 20;

    async function loadProductsAdmin(page = 1) {
      try {
        const res = await apiFetch(`/products?page=${page}&per_page=${PROD_PER_PAGE}`);
        if (!res || !res.ok) { document.getElementById('prod-table-wrap').textContent = 'Error al cargar.'; return; }
        const { products, total } = await res.json();
        const totalPages = Math.ceil(total / PROD_PER_PAGE);
        document.getElementById('prod-count').textContent = `${total} productos`;
        document.getElementById('prod-table-wrap').innerHTML =
          productsTable(products) + paginationBar(page, totalPages, 'loadProductsAdmin');
      } catch {
        document.getElementById('prod-table-wrap').textContent = 'Error al cargar.';
      }
    }

    function productsTable(products) {
      if (!products.length) return `<p style="padding:var(--sp-8);text-align:center;color:var(--clr-text-muted)">Sin productos todavía.</p>`;
      const actionStyle = 'padding:var(--sp-1) var(--sp-3);font-size:var(--text-sm)';
      return `<table>
        <thead><tr>
          <th>Nombre</th>
          <th>Modalidad</th>
          <th>U/M</th>
          <th>Precio</th>
          <th>Símbolos</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${products.map(p => `<tr>
            <td style="font-weight:var(--fw-semibold)">${p.name}${p.description ? `<br><small style="font-weight:var(--fw-normal);color:var(--clr-text-muted)">${p.description}</small>` : ''}</td>
            <td>${saleModeBadge(p.sale_mode)}</td>
            <td style="color:var(--clr-text-muted)">${p.unit_of_measure}</td>
            <td>${fmtCents(p.price_cents)}</td>
            <td>${symbolPills(p.symbols)}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-ghost" style="${actionStyle}"
                data-action="edit-product"
                data-id="${p.id}"
                data-name="${(p.name || '').replace(/"/g, '&quot;')}"
                data-description="${(p.description || '').replace(/"/g, '&quot;')}"
                data-salemode="${p.sale_mode}"
                data-unit="${p.unit_of_measure}"
                data-price="${p.price_cents}"
                data-image="${(p.image_url || '').replace(/"/g, '&quot;')}"
                data-symbols="${p.symbols.join(',')}">Editar</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    // ── Users ─────────────────────────────────────────────────────

    let editingUserId   = null;
    let editingUserMode = null;

    async function renderUsers(el) {
      editingUserId   = null;
      editingUserMode = null;

      el.innerHTML = `
        <div class="form-card">
          <div class="section-header" style="padding:0;margin-bottom:var(--sp-5)">
            <h2 id="user-form-title">Agregar usuario</h2>
          </div>
          <form id="user-form">
            <div class="form-2col">
              <div class="form-2col-row">
                <div class="form-2col-field" id="user-email-field">
                  <label for="u-email">Email *</label>
                  <input id="u-email" type="email" placeholder="usuario@ejemplo.com" required />
                </div>
                <div class="form-2col-hint">
                  <strong>Dirección de email.</strong>
                  Será el usuario de acceso al panel de administración.
                </div>
              </div>
              <div class="form-2col-row">
                <div class="form-2col-field" id="user-password-field">
                  <label for="u-password">Contraseña *</label>
                  <input id="u-password" type="password" placeholder="mínimo 8 caracteres" required />
                </div>
                <div class="form-2col-hint">
                  <strong>Contraseña de acceso.</strong>
                  Mínimo 8 caracteres. Incluí mayúsculas, números o símbolos para mayor seguridad.
                </div>
              </div>
            </div>
            <div style="display:flex;gap:var(--sp-3)">
              <button class="btn btn-primary" type="submit" id="user-submit-btn">Agregar usuario</button>
              <button class="btn btn-ghost" type="button" id="user-cancel-btn" style="display:none" onclick="cancelUserEdit()">Cancelar</button>
            </div>
          </form>
        </div>

        <div class="section-header" style="padding:0;margin-bottom:var(--sp-4)">
          <h2>Todos los usuarios</h2>
          <span id="user-count" class="text-muted"></span>
        </div>
        <div class="table-wrap" id="user-table-wrap">Cargando…</div>`;

      await loadUsersAdmin();

      document.getElementById('user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn      = document.getElementById('user-submit-btn');
        const original = btn.textContent;
        btn.disabled   = true;
        btn.textContent = '…';

        try {
          if (editingUserId && editingUserMode === 'email') {
            const email = document.getElementById('u-email').value.trim();
            if (!email) return;
            const res = await apiFetch(`/users/${editingUserId}`, { method: 'PATCH', body: JSON.stringify({ email }) });
            if (!res || !res.ok) { toast('Error al actualizar el email', 'error'); return; }
            toast('Email actualizado');
          } else if (editingUserId && editingUserMode === 'password') {
            const password = document.getElementById('u-password').value;
            if (!password) return;
            const res = await apiFetch(`/users/${editingUserId}/password`, { method: 'PATCH', body: JSON.stringify({ password }) });
            if (!res || !res.ok) { toast('Error al actualizar la contraseña', 'error'); return; }
            toast('Contraseña actualizada');
          } else {
            const email    = document.getElementById('u-email').value.trim();
            const password = document.getElementById('u-password').value;
            if (!email || !password) return;
            const res = await apiFetch('/users', { method: 'POST', body: JSON.stringify({ email, password }) });
            if (!res || !res.ok) { toast('Error al crear el usuario', 'error'); return; }
            toast('Usuario creado');
          }
          cancelUserEdit();
          await loadUsersAdmin();
        } catch { toast('Error del servidor', 'error'); }
        finally   { btn.disabled = false; btn.textContent = original; }
      });

      document.getElementById('user-table-wrap').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const user = { id: btn.dataset.id, email: btn.dataset.email };
        if (btn.dataset.action === 'edit-email')    startEditUserEmail(user);
        if (btn.dataset.action === 'edit-password') startEditUserPassword(user);
      });
    }

    function cancelUserEdit() {
      editingUserId   = null;
      editingUserMode = null;
      document.getElementById('user-form-title').textContent = 'Agregar usuario';
      const emailRow = document.getElementById('user-email-field').closest('.form-2col-row');
      const passRow  = document.getElementById('user-password-field').closest('.form-2col-row');
      emailRow.style.display = '';
      passRow.style.display  = '';
      document.getElementById('u-email').value               = '';
      document.getElementById('u-password').value            = '';
      document.getElementById('u-email').required            = true;
      document.getElementById('u-password').required         = true;
      document.getElementById('user-submit-btn').textContent = 'Agregar usuario';
      document.getElementById('user-cancel-btn').style.display = 'none';
    }

    function startEditUserEmail(user) {
      editingUserId   = user.id;
      editingUserMode = 'email';
      const emailRow = document.getElementById('user-email-field').closest('.form-2col-row');
      const passRow  = document.getElementById('user-password-field').closest('.form-2col-row');
      document.getElementById('user-form-title').textContent = 'Editar email';
      emailRow.style.display = '';
      passRow.style.display  = 'none';
      document.getElementById('u-email').value               = user.email;
      document.getElementById('u-email').required            = true;
      document.getElementById('u-password').required         = false;
      document.getElementById('user-submit-btn').textContent = 'Guardar email';
      document.getElementById('user-cancel-btn').style.display = '';
      document.getElementById('user-form-title').scrollIntoView({ behavior: 'smooth' });
    }

    function startEditUserPassword(user) {
      editingUserId   = user.id;
      editingUserMode = 'password';
      const emailRow = document.getElementById('user-email-field').closest('.form-2col-row');
      const passRow  = document.getElementById('user-password-field').closest('.form-2col-row');
      document.getElementById('user-form-title').textContent = 'Cambiar contraseña';
      emailRow.style.display = 'none';
      passRow.style.display  = '';
      document.getElementById('u-password').value            = '';
      document.getElementById('u-email').required            = false;
      document.getElementById('u-password').required         = true;
      document.getElementById('user-submit-btn').textContent = 'Guardar contraseña';
      document.getElementById('user-cancel-btn').style.display = '';
      document.getElementById('user-form-title').scrollIntoView({ behavior: 'smooth' });
    }

    const USER_PER_PAGE = 20;

    async function loadUsersAdmin(page = 1) {
      try {
        const res = await apiFetch(`/users?page=${page}&per_page=${USER_PER_PAGE}`);
        if (!res || !res.ok) { document.getElementById('user-table-wrap').textContent = 'Error al cargar.'; return; }
        const { users, total } = await res.json();
        const totalPages = Math.ceil(total / USER_PER_PAGE);
        document.getElementById('user-count').textContent = `${total} usuarios`;
        document.getElementById('user-table-wrap').innerHTML =
          usersTable(users) + paginationBar(page, totalPages, 'loadUsersAdmin');
      } catch {
        document.getElementById('user-table-wrap').textContent = 'Error al cargar.';
      }
    }

    function usersTable(users) {
      if (!users.length) return `<p style="padding:var(--sp-8);text-align:center;color:var(--clr-text-muted)">Sin usuarios todavía.</p>`;
      const actionStyle = 'padding:var(--sp-1) var(--sp-3);font-size:var(--text-sm)';
      return `<table>
        <thead><tr>
          <th>Email</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${users.map(u => `<tr>
            <td style="font-weight:var(--fw-semibold)">${u.email}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-ghost" style="${actionStyle}"
                data-action="edit-email"
                data-id="${u.id}"
                data-email="${(u.email || '').replace(/"/g, '&quot;')}">Email</button>
              <button class="btn btn-ghost" style="${actionStyle}"
                data-action="edit-password"
                data-id="${u.id}"
                data-email="${(u.email || '').replace(/"/g, '&quot;')}">Contraseña</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    // ── Init ──────────────────────────────────────────────────────

    async function init() {
      const res = await fetch(`${API}/users?page=1&per_page=1`);
      if (res.status === 401) { window.location.href = '/login.html'; return; }
      renderPage('products');
    }

    init();
  </script>
</body>
</html>
