<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos — Admin Pichel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="layout-admin">

  <aside class="sidebar" id="sidebar">
    <a href="/admin/" class="sidebar-brand">Pichel <small>ADMIN</small></a>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="/admin/">
        <span class="icon">📋</span> Pedidos
      </a>
      <a class="nav-item" href="/admin/products.html">
        <span class="icon">📦</span> Productos
      </a>
      <a class="nav-item" href="/admin/users.html">
        <span class="icon">👤</span> Usuarios
      </a>
      <a class="nav-item nav-item--push" href="/" target="_blank" rel="noopener">
        <span class="icon">🛒</span> Ver tienda
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></button>
      <span class="topbar-title">Pedidos</span>
      <span id="order-count" class="topbar-user"></span>
    </div>
    <div class="content">
      <div class="table-wrap" id="orders-wrap">Cargando…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch(`${API}/auth/logout`, { method: 'POST' });
      window.location.href = '/login.html';
    });

    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast show ${type}`;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }

    async function apiFetch(path, opts = {}) {
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (res.status === 401) { window.location.href = '/login.html'; return res; }
      return res;
    }

    function fmtCents(cents) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(cents / 100);
    }

    function fmtDate(d) {
      return new Date(d).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' })
        + ' ' + new Date(d).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }

    function statusBadge(status) {
      const map = {
        pending:   { cls: 'badge-pending',   label: 'Pendiente'  },
        closed:    { cls: 'badge-closed',     label: 'Cerrado'    },
        cancelled: { cls: 'badge-cancelled',  label: 'Cancelado'  },
      };
      const s = map[status] || { cls: '', label: status };
      return `<span class="badge ${s.cls}">${s.label}</span>`;
    }

    function fmtQty(item) {
      if (item.sale_mode === 'bulk') {
        const g = item.quantity;
        return g >= 1000 ? `${g}g (${(g / 1000).toFixed(1).replace(/\.0$/, '')}kg)` : `${g}g`;
      }
      return item.quantity === 1 ? '1 unidad' : `${item.quantity} unidades`;
    }

    const PER_PAGE = 25;
    let currentPage = 1;

    function paginationBar(page, totalPages) {
      if (totalPages <= 1) return '';
      return `<div class="pagination">
        <button class="pagination-btn" onclick="loadOrders(${page - 1})" ${page <= 1 ? 'disabled' : ''}>← Anterior</button>
        <span class="pagination-info">Página ${page} de ${totalPages}</span>
        <button class="pagination-btn" onclick="loadOrders(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>Siguiente →</button>
      </div>`;
    }

    function ordersTable(orders, page, totalPages) {
      if (!orders.length) {
        return `<p class="table-empty">Sin pedidos todavía.</p>`;
      }
      return `<table>
        <thead><tr>
          <th>Fecha</th>
          <th>Cliente</th>
          <th>Productos</th>
          <th>Total</th>
          <th>Estado</th>
        </tr></thead>
        <tbody>
          ${orders.map(o => {
            const itemsSummary = o.items.map(i => `${i.product_name} · ${fmtQty(i)}`).join('<br>');
            return `<tr>
              <td class="td-meta">${fmtDate(o.created_at)}</td>
              <td>
                <span class="fw-semibold">${o.customer_phone}</span>
                ${o.customer_name ? `<br><small class="text-muted">${o.customer_name}</small>` : ''}
              </td>
              <td class="td-items">${itemsSummary}</td>
              <td class="td-amount">${fmtCents(o.total_price_cents)}</td>
              <td>${statusBadge(o.status)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>${paginationBar(page, totalPages)}`;
    }

    async function loadOrders(page = 1) {
      currentPage = page;
      const wrap = document.getElementById('orders-wrap');
      try {
        const res = await apiFetch(`/orders?page=${page}&per_page=${PER_PAGE}`);
        if (!res || !res.ok) { wrap.textContent = 'Error al cargar pedidos.'; return; }
        const { orders, total } = await res.json();
        const totalPages = Math.ceil(total / PER_PAGE);
        document.getElementById('order-count').textContent = `${total} pedido${total !== 1 ? 's' : ''}`;
        wrap.innerHTML = ordersTable(orders, page, totalPages);
      } catch {
        wrap.textContent = 'Error al cargar pedidos.';
      }
    }

    async function init() {
      const res = await fetch(`${API}/users?page=1&per_page=1`);
      if (res.status === 401) { window.location.href = '/login.html'; return; }
      await loadOrders();
    }

    init();
  </script>
</body>
</html>
