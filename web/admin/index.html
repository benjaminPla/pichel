<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Pichel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="layout-admin">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-brand">Pichel <small>ADMIN</small></a>
    <nav class="sidebar-nav">
      <div class="nav-section">Principal</div>
      <a class="nav-item active" data-page="dashboard">
        <span class="icon">📊</span> Dashboard
      </a>
      <a class="nav-item" data-page="products">
        <span class="icon">📦</span> Productos
      </a>
      <div class="nav-section">Próximamente</div>
      <a class="nav-item" data-page="orders">
        <span class="icon">🧾</span> Pedidos
      </a>
      <a class="nav-item" data-page="users">
        <span class="icon">👥</span> Usuarios
      </a>
      <a class="nav-item" data-page="settings">
        <span class="icon">⚙️</span> Configuración
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <span class="topbar-user" id="topbar-user"></span>
    </div>

    <div class="content" id="content"></div>
  </div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"></div>

  <script>
    const API = '';

    // ── Auth guard ──
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    // ── Decode user from JWT ──
    function parseJwt(t) {
      try {
        return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      } catch { return {}; }
    }
    const payload = parseJwt(token);
    document.getElementById('topbar-user').textContent = payload.sub || 'Admin';

    // ── Sidebar toggle (mobile) ──
    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // ── Logout ──
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    });

    // ── Nav routing ──
    const navItems = document.querySelectorAll('.nav-item[data-page]');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        document.getElementById('topbar-title').textContent = item.textContent.trim();
        document.getElementById('sidebar').classList.remove('open');
        renderPage(item.dataset.page);
      });
    });

    // ── Toast helper ──
    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast show ${type}`;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }

    // ── API helpers ──
    async function apiFetch(path, opts = {}) {
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(opts.headers || {}),
        },
      });
      if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/login.html'; }
      return res;
    }

    // ── Pages ──────────────────────────────────────────────────

    async function renderPage(page) {
      const content = document.getElementById('content');
      switch (page) {
        case 'dashboard': return renderDashboard(content);
        case 'products':  return renderProducts(content);
        default:
          content.innerHTML = `<p style="color:var(--clr-text-muted);margin-top:var(--sp-12);text-align:center">
            Esta sección está en desarrollo.
          </p>`;
      }
    }

    // ── Dashboard ──
    async function renderDashboard(el) {
      el.innerHTML = `<div class="stats">
        ${statSkeleton()} ${statSkeleton()} ${statSkeleton()} ${statSkeleton()}
      </div>`;

      try {
        const res      = await apiFetch('/products');
        const products = res.ok ? await res.json() : [];
        const total    = products.reduce((s, p) => s + p.price_cents, 0);
        const avg      = products.length ? total / products.length : 0;

        el.innerHTML = `
          <div class="stats">
            <div class="stat-card">
              <div class="stat-label">Productos</div>
              <div class="stat-value accent">${products.length}</div>
              <div class="stat-sub">en catálogo</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Valor total</div>
              <div class="stat-value">${fmtCents(total)}</div>
              <div class="stat-sub">suma de precios</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Precio promedio</div>
              <div class="stat-value">${fmtCents(avg)}</div>
              <div class="stat-sub">por producto</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Pedidos</div>
              <div class="stat-value" style="color:var(--clr-text-muted)">—</div>
              <div class="stat-sub">próximamente</div>
            </div>
          </div>

          <div class="section-header" style="padding:0;margin-bottom:var(--sp-4)">
            <h2>Productos recientes</h2>
            <button class="btn btn-ghost" onclick="renderPage('products')">Ver todos</button>
          </div>
          <div class="table-wrap">${productsTable(products.slice(0, 5))}</div>
        `;
      } catch {
        el.innerHTML = `<p style="color:var(--clr-text-muted)">Error al cargar el dashboard.</p>`;
      }
    }

    // ── Products ──
    async function renderProducts(el) {
      el.innerHTML = `
        <div class="form-card">
          <div class="section-header" style="padding:0;margin-bottom:var(--sp-4)">
            <h2>Agregar producto</h2>
          </div>
          <form id="add-form">
            <div class="form-row">
              <div class="form-field">
                <label>Nombre</label>
                <input id="p-name" placeholder="ej. Avena integral" required />
              </div>
              <div class="form-field">
                <label>Unidad</label>
                <input id="p-unit" placeholder="ej. 500g" required />
              </div>
              <div class="form-field">
                <label>Precio (centavos)</label>
                <input id="p-price" type="number" min="0" step="1" placeholder="420" required />
              </div>
              <button class="btn btn-primary" type="submit" id="add-btn">Agregar</button>
            </div>
          </form>
        </div>

        <div class="section-header" style="padding:0;margin-bottom:var(--sp-4)">
          <h2>Todos los productos</h2>
          <span id="prod-count" style="font-size:var(--text-sm);color:var(--clr-text-muted)"></span>
        </div>
        <div class="table-wrap" id="prod-table-wrap">Cargando…</div>
      `;

      await loadProductsAdmin();

      document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name        = document.getElementById('p-name').value.trim();
        const unit_amount = document.getElementById('p-unit').value.trim();
        const price_cents = parseInt(document.getElementById('p-price').value);
        if (!name || !unit_amount || isNaN(price_cents)) return;

        const btn = document.getElementById('add-btn');
        btn.disabled = true; btn.textContent = '…';

        try {
          const res = await apiFetch('/products', {
            method: 'POST',
            body: JSON.stringify({ name, unit_amount, price_cents, unit_type: 1 }),
          });
          if (!res.ok) { toast('Error al crear el producto', 'error'); return; }
          document.getElementById('p-name').value  = '';
          document.getElementById('p-unit').value  = '';
          document.getElementById('p-price').value = '';
          toast('Producto agregado');
          await loadProductsAdmin();
        } catch { toast('Error del servidor', 'error'); }
        finally { btn.disabled = false; btn.textContent = 'Agregar'; }
      });
    }

    async function loadProductsAdmin() {
      try {
        const res      = await apiFetch('/products');
        const products = res.ok ? await res.json() : [];
        document.getElementById('prod-count').textContent = `${products.length} productos`;
        document.getElementById('prod-table-wrap').innerHTML = productsTable(products);
      } catch {
        document.getElementById('prod-table-wrap').textContent = 'Error al cargar.';
      }
    }

    // ── Shared table ──
    function productsTable(products) {
      if (!products.length) return `<p style="padding:var(--sp-8);text-align:center;color:var(--clr-text-muted)">Sin productos todavía.</p>`;
      return `<table>
        <thead><tr>
          <th>Nombre</th>
          <th>Unidad</th>
          <th>Precio</th>
          <th>Estado</th>
          <th>ID</th>
        </tr></thead>
        <tbody>
          ${products.map(p => `<tr>
            <td style="font-weight:var(--fw-semibold)">${p.name}</td>
            <td style="color:var(--clr-text-muted)">${p.unit_amount}</td>
            <td>${fmtCents(p.price_cents)}</td>
            <td><span class="badge badge-green">Activo</span></td>
            <td style="color:var(--clr-text-muted);font-size:var(--text-xs);font-family:monospace">${p.id.slice(0,8)}…</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    // ── Helpers ──
    function fmtCents(cents) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(cents / 100);
    }
    function statSkeleton() {
      return `<div class="stat-card" style="opacity:.35">
        <div class="stat-label" style="background:var(--clr-surface-2);height:10px;width:60%;border-radius:var(--radius-sm)"></div>
        <div class="stat-value" style="background:var(--clr-surface-2);height:30px;width:50%;border-radius:var(--radius-sm);margin-top:var(--sp-2)"></div>
      </div>`;
    }

    // ── Init ──
    renderPage('dashboard');
  </script>
</body>
</html>
