<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Pichel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --surface2: #222;
      --border:   #2a2a2a;
      --accent:   #e8c547;
      --accent-dim:#b89a30;
      --text:     #f0f0f0;
      --muted:    #888;
      --success:  #4caf82;
      --error:    #e55;
      --radius:   10px;
      --sidebar:  220px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar);
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 50;
      transition: transform .25s;
    }

    .sidebar-brand {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent);
      padding: 0 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      letter-spacing: -.4px;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .sidebar-brand small {
      font-size: .65rem;
      font-weight: 500;
      background: var(--accent);
      color: #000;
      border-radius: 4px;
      padding: 1px 5px;
      letter-spacing: 0;
    }

    nav.sidebar-nav {
      flex: 1;
      padding: 1rem 0;
    }

    .nav-section {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      padding: .75rem 1.25rem .3rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .6rem 1.25rem;
      color: var(--muted);
      text-decoration: none;
      font-size: .9rem;
      border-left: 3px solid transparent;
      transition: background .12s, color .12s, border-color .12s;
      cursor: pointer;
    }
    .nav-item:hover  { background: var(--surface2); color: var(--text); }
    .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(232,197,71,.06); }
    .nav-item .icon  { font-size: 1rem; width: 18px; text-align: center; }

    .sidebar-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .btn-logout {
      width: 100%;
      padding: .5rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: .85rem;
      transition: border-color .15s, color .15s;
    }
    .btn-logout:hover { border-color: var(--error); color: var(--error); }

    /* ── Main ────────────────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.75rem;
      gap: 1rem;
      position: sticky;
      top: 0;
      background: rgba(15,15,15,.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .topbar-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .topbar-user {
      margin-left: auto;
      font-size: .85rem;
      color: var(--muted);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      padding: 4px;
    }
    .menu-toggle span {
      display: block;
      width: 20px; height: 2px;
      background: var(--text);
      border-radius: 2px;
    }

    .content { padding: 1.75rem; flex: 1; }

    /* ── Stat cards ──────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
    }
    .stat-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .4rem; }
    .stat-value { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
    .stat-value.accent { color: var(--accent); }
    .stat-sub   { font-size: .78rem; color: var(--muted); margin-top: .2rem; }

    /* ── Section header ──────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .section-header h2 { font-size: 1rem; font-weight: 700; }

    .btn {
      padding: .5rem 1rem;
      border-radius: var(--radius);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background .15s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-dim); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--surface2); }
    .btn-danger { background: rgba(238,85,85,.12); color: var(--error); border: 1px solid rgba(238,85,85,.25); }
    .btn-danger:hover { background: rgba(238,85,85,.22); }

    /* ── Product table ───────────────────────────────────────── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    thead { background: var(--surface2); }
    th { text-align: left; padding: .75rem 1rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
    td { padding: .8rem 1rem; border-top: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: var(--surface2); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
    }
    .badge-green { background: rgba(76,175,130,.15); color: var(--success); }

    /* ── Add product form ────────────────────────────────────── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 160px auto;
      gap: .75rem;
      align-items: end;
    }

    .form-field label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: .35rem;
    }

    .form-field input {
      width: 100%;
      padding: .6rem .85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .9rem;
      outline: none;
      transition: border-color .15s;
    }
    .form-field input:focus { border-color: var(--accent); }
    .form-field input::placeholder { color: #444; }

    .toast {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .75rem 1.1rem;
      font-size: .875rem;
      display: none;
      z-index: 200;
      min-width: 220px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .toast.show { display: block; animation: slideUp .2s ease; }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--error); }
    @keyframes slideUp { from { opacity:0; transform: translateY(8px); } }

    /* ── Mobile ──────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }

      .main { margin-left: 0; }
      .menu-toggle { display: flex; }

      .form-row {
        grid-template-columns: 1fr;
      }

      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .content { padding: 1rem; }
    }
  </style>
</head>
<body>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-brand">Pichel <small>ADMIN</small></a>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a class="nav-item active" data-page="dashboard">
        <span class="icon">📊</span> Dashboard
      </a>
      <a class="nav-item" data-page="products">
        <span class="icon">📦</span> Products
      </a>
      <div class="nav-section">Coming soon</div>
      <a class="nav-item" data-page="orders">
        <span class="icon">🧾</span> Orders
      </a>
      <a class="nav-item" data-page="users">
        <span class="icon">👥</span> Users
      </a>
      <a class="nav-item" data-page="settings">
        <span class="icon">⚙️</span> Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <span class="topbar-user" id="topbar-user"></span>
    </div>

    <div class="content" id="content"></div>
  </div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"></div>

  <script>
    const API = '';

    // ── Auth guard ──
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    // ── Decode user from JWT (no library, just base64) ──
    function parseJwt(t) {
      try {
        return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      } catch { return {}; }
    }
    const payload = parseJwt(token);
    document.getElementById('topbar-user').textContent = payload.sub || 'Admin';

    // ── Sidebar toggle (mobile) ──
    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // ── Logout ──
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    });

    // ── Nav routing ──
    const navItems = document.querySelectorAll('.nav-item[data-page]');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        document.getElementById('topbar-title').textContent = item.textContent.trim();
        document.getElementById('sidebar').classList.remove('open');
        renderPage(item.dataset.page);
      });
    });

    // ── Toast helper ──
    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast show ${type}`;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }

    // ── API helpers ──
    async function apiFetch(path, opts = {}) {
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(opts.headers || {}),
        },
      });
      if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/login.html'; }
      return res;
    }

    // ── Pages ──────────────────────────────────────────────────

    async function renderPage(page) {
      const content = document.getElementById('content');
      switch (page) {
        case 'dashboard': return renderDashboard(content);
        case 'products':  return renderProducts(content);
        default:
          content.innerHTML = `<p style="color:var(--muted);margin-top:3rem;text-align:center">
            This section is coming soon.
          </p>`;
      }
    }

    // ── Dashboard ──
    async function renderDashboard(el) {
      el.innerHTML = `<div class="stats">
        ${statSkeleton()} ${statSkeleton()} ${statSkeleton()} ${statSkeleton()}
      </div>`;

      try {
        const res      = await apiFetch('/products');
        const products = res.ok ? await res.json() : [];
        const total    = products.reduce((s, p) => s + p.price_cents, 0);
        const avg      = products.length ? total / products.length : 0;

        el.innerHTML = `
          <div class="stats">
            <div class="stat-card">
              <div class="stat-label">Products</div>
              <div class="stat-value accent">${products.length}</div>
              <div class="stat-sub">in catalogue</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Total value</div>
              <div class="stat-value">${fmtCents(total)}</div>
              <div class="stat-sub">sum of prices</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Avg. price</div>
              <div class="stat-value">${fmtCents(avg)}</div>
              <div class="stat-sub">per product</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Orders</div>
              <div class="stat-value" style="color:var(--muted)">—</div>
              <div class="stat-sub">coming soon</div>
            </div>
          </div>

          <div class="section-header">
            <h2>Recent products</h2>
            <button class="btn btn-ghost" onclick="renderPage('products')">View all</button>
          </div>
          <div class="table-wrap">${productsTable(products.slice(0, 5))}</div>
        `;
      } catch {
        el.innerHTML = `<p style="color:var(--muted)">Failed to load dashboard data.</p>`;
      }
    }

    // ── Products ──
    async function renderProducts(el) {
      el.innerHTML = `
        <div class="form-card">
          <div class="section-header" style="margin-bottom:.85rem">
            <h2>Add product</h2>
          </div>
          <form id="add-form">
            <div class="form-row">
              <div class="form-field">
                <label>Name</label>
                <input id="p-name" placeholder="e.g. Wagyu Ribeye" required />
              </div>
              <div class="form-field">
                <label>Unit</label>
                <input id="p-unit" placeholder="e.g. 200g" required />
              </div>
              <div class="form-field">
                <label>Price (cents)</label>
                <input id="p-price" type="number" min="0" step="1" placeholder="4500" required />
              </div>
              <button class="btn btn-primary" type="submit" id="add-btn">Add</button>
            </div>
          </form>
        </div>

        <div class="section-header">
          <h2>All products</h2>
          <span id="prod-count" style="font-size:.85rem;color:var(--muted)"></span>
        </div>
        <div class="table-wrap" id="prod-table-wrap">Loading…</div>
      `;

      await loadProductsAdmin();

      document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name        = document.getElementById('p-name').value.trim();
        const unit_amount = document.getElementById('p-unit').value.trim();
        const price_cents = parseInt(document.getElementById('p-price').value);
        if (!name || !unit_amount || isNaN(price_cents)) return;

        const btn = document.getElementById('add-btn');
        btn.disabled = true; btn.textContent = '…';

        try {
          const res = await apiFetch('/products', {
            method: 'POST',
            body: JSON.stringify({ name, unit_amount, price_cents, unit_type: 1 }),
          });
          if (!res.ok) { toast('Failed to create product', 'error'); return; }
          document.getElementById('p-name').value  = '';
          document.getElementById('p-unit').value  = '';
          document.getElementById('p-price').value = '';
          toast('Product added');
          await loadProductsAdmin();
        } catch { toast('Server error', 'error'); }
        finally { btn.disabled = false; btn.textContent = 'Add'; }
      });
    }

    async function loadProductsAdmin() {
      try {
        const res      = await apiFetch('/products');
        const products = res.ok ? await res.json() : [];
        document.getElementById('prod-count').textContent = `${products.length} items`;
        document.getElementById('prod-table-wrap').innerHTML = productsTable(products);
      } catch {
        document.getElementById('prod-table-wrap').textContent = 'Failed to load.';
      }
    }

    // ── Shared table ──
    function productsTable(products) {
      if (!products.length) return `<p style="padding:2rem;text-align:center;color:var(--muted)">No products yet.</p>`;
      return `<table>
        <thead><tr>
          <th>Name</th>
          <th>Unit</th>
          <th>Price</th>
          <th>Status</th>
          <th>ID</th>
        </tr></thead>
        <tbody>
          ${products.map(p => `<tr>
            <td style="font-weight:600">${p.name}</td>
            <td style="color:var(--muted)">${p.unit_amount}</td>
            <td>${fmtCents(p.price_cents)}</td>
            <td><span class="badge badge-green">Active</span></td>
            <td style="color:var(--muted);font-size:.78rem;font-family:monospace">${p.id.slice(0,8)}…</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    // ── Helpers ──
    function fmtCents(cents) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(cents / 100);
    }
    function statSkeleton() {
      return `<div class="stat-card" style="opacity:.35">
        <div class="stat-label" style="background:var(--border);height:10px;width:60%;border-radius:4px"></div>
        <div class="stat-value" style="background:var(--border);height:30px;width:50%;border-radius:4px;margin-top:.5rem"></div>
      </div>`;
    }

    // ── Init ──
    renderPage('dashboard');
  </script>
</body>
</html>
