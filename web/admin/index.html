<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Pichel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="layout-admin">

  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-brand">Pichel <small>ADMIN</small></a>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-page="dashboard">
        <span class="icon">📊</span> Dashboard
      </a>
      <a class="nav-item" data-page="products">
        <span class="icon">📦</span> Productos
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
    </div>
    <div class="content" id="content"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';

    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    });

    const navItems = document.querySelectorAll('.nav-item[data-page]');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        document.getElementById('topbar-title').textContent = item.textContent.trim();
        document.getElementById('sidebar').classList.remove('open');
        renderPage(item.dataset.page);
      });
    });

    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast show ${type}`;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }

    async function apiFetch(path, opts = {}) {
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(opts.headers || {}),
        },
      });
      if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/login.html'; }
      return res;
    }

    function fmtCents(cents) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(cents / 100);
    }

    function stockStatusBadge(status) {
      if (status === 'out_of_stock') return `<span class="badge badge-out">Sin stock</span>`;
      if (status === 'low_stock')    return `<span class="badge badge-low">Stock bajo</span>`;
      return `<span class="badge badge-green">En stock</span>`;
    }

    // ── Pages ──────────────────────────────────────────────────────

    function renderPage(page) {
      const content = document.getElementById('content');
      if (page === 'dashboard') return renderDashboard(content);
      if (page === 'products')  return renderProducts(content);
    }

    // ── Dashboard ─────────────────────────────────────────────────

    async function renderDashboard(el) {
      el.innerHTML = `<div class="stats">${statSkeleton()}${statSkeleton()}${statSkeleton()}</div>`;

      try {
        const res      = await apiFetch('/products/admin');
        const products = res.ok ? await res.json() : [];

        const total      = products.length;
        const invValue   = products.reduce((s, p) => s + p.stock * p.price_cents, 0);
        const avgPrice   = total ? Math.round(products.reduce((s, p) => s + p.price_cents, 0) / total) : 0;
        const outOfStock = products.filter(p => p.stock_status === 'out_of_stock');
        const lowStock   = products.filter(p => p.stock_status === 'low_stock');

        el.innerHTML = `
          <div class="stats">
            <div class="stat-card">
              <div class="stat-label">Productos</div>
              <div class="stat-value accent">${total}</div>
              <div class="stat-sub">en catálogo</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Valor de inventario</div>
              <div class="stat-value">${fmtCents(invValue)}</div>
              <div class="stat-sub">stock × precio de venta</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Precio promedio</div>
              <div class="stat-value">${fmtCents(avgPrice)}</div>
              <div class="stat-sub">precio de venta</div>
            </div>
          </div>

          ${(outOfStock.length || lowStock.length) ? `
          <div class="alert-panel">
            ${outOfStock.length ? `
              <div class="alert-block alert-block--error">
                <div class="alert-title">⚠ Sin stock (${outOfStock.length})</div>
                <ul class="alert-list">
                  ${outOfStock.map(p => `<li>${p.name} <span class="text-muted">— ${p.unit_amount}</span></li>`).join('')}
                </ul>
              </div>` : ''}
            ${lowStock.length ? `
              <div class="alert-block alert-block--warning">
                <div class="alert-title">⚡ Stock bajo (${lowStock.length})</div>
                <ul class="alert-list">
                  ${lowStock.map(p => `<li>${p.name} <span class="text-muted">— ${p.stock} uds.</span></li>`).join('')}
                </ul>
              </div>` : ''}
          </div>` : ''}`;
      } catch {
        el.innerHTML = `<p style="color:var(--clr-text-muted)">Error al cargar el dashboard.</p>`;
      }
    }

    // ── Products ──────────────────────────────────────────────────

    async function renderProducts(el) {
      el.innerHTML = `
        <div class="form-card">
          <div class="section-header" style="padding:0;margin-bottom:var(--sp-5)">
            <h2>Agregar producto</h2>
          </div>
          <form id="add-form">
            <div class="form-grid">
              <div class="form-field">
                <label>Nombre *</label>
                <input id="p-name" placeholder="ej. Avena integral" required />
              </div>
              <div class="form-field">
                <label>Descripción</label>
                <input id="p-desc" placeholder="ej. Sin gluten, orgánica" />
              </div>
              <div class="form-field">
                <label>Presentación *</label>
                <input id="p-unit" placeholder="ej. 500g" required />
              </div>
              <div class="form-field">
                <label>Tipo de unidad *</label>
                <select id="p-unit-type" class="form-select">
                  <option value="1">Peso</option>
                  <option value="2">Volumen</option>
                  <option value="3">Unidad</option>
                </select>
              </div>
              <div class="form-field">
                <label>Precio de venta (centavos) *</label>
                <input id="p-price" type="number" min="0" step="1" placeholder="ej. 420" required />
              </div>
              <div class="form-field">
                <label>Costo (centavos)</label>
                <input id="p-cost" type="number" min="0" step="1" placeholder="ej. 260" />
              </div>
              <div class="form-field">
                <label>Stock inicial</label>
                <input id="p-stock" type="number" min="0" step="1" placeholder="0" value="0" />
              </div>
              <div class="form-field">
                <label>Alerta stock bajo</label>
                <input id="p-threshold" type="number" min="0" step="1" placeholder="5" value="5" />
              </div>
              <div class="form-field">
                <label>URL de imagen</label>
                <input id="p-img" placeholder="/images/products/nombre.webp" />
              </div>
            </div>
            <div style="margin-top:var(--sp-5)">
              <button class="btn btn-primary" type="submit" id="add-btn">Agregar producto</button>
            </div>
          </form>
        </div>

        <div class="section-header" style="padding:0;margin-bottom:var(--sp-4)">
          <h2>Todos los productos</h2>
          <span id="prod-count" class="text-muted"></span>
        </div>
        <div class="table-wrap" id="prod-table-wrap">Cargando…</div>`;

      await loadProductsAdmin();

      document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name                = document.getElementById('p-name').value.trim();
        const description         = document.getElementById('p-desc').value.trim();
        const unit_amount         = document.getElementById('p-unit').value.trim();
        const unit_type           = parseInt(document.getElementById('p-unit-type').value);
        const price_cents         = parseInt(document.getElementById('p-price').value);
        const cost_price_raw      = document.getElementById('p-cost').value.trim();
        const stock               = parseInt(document.getElementById('p-stock').value) || 0;
        const low_stock_threshold = parseInt(document.getElementById('p-threshold').value) || 5;
        const image_url           = document.getElementById('p-img').value.trim();

        if (!name || !unit_amount || isNaN(price_cents)) return;

        const btn = document.getElementById('add-btn');
        btn.disabled = true; btn.textContent = '…';

        try {
          const body = { name, unit_amount, unit_type, price_cents, stock, low_stock_threshold };
          if (description)    body.description = description;
          if (cost_price_raw) body.cost_price  = parseInt(cost_price_raw);
          if (image_url)      body.image_url   = image_url;

          const res = await apiFetch('/products', {
            method: 'POST',
            body: JSON.stringify(body),
          });
          if (!res.ok) { toast('Error al crear el producto', 'error'); return; }

          ['p-name','p-desc','p-unit','p-price','p-cost','p-img'].forEach(id => document.getElementById(id).value = '');
          document.getElementById('p-unit-type').value = '1';
          document.getElementById('p-stock').value     = '0';
          document.getElementById('p-threshold').value = '5';
          toast('Producto agregado');
          await loadProductsAdmin();
        } catch { toast('Error del servidor', 'error'); }
        finally { btn.disabled = false; btn.textContent = 'Agregar producto'; }
      });
    }

    async function loadProductsAdmin() {
      try {
        const res      = await apiFetch('/products/admin');
        const products = res.ok ? await res.json() : [];
        document.getElementById('prod-count').textContent = `${products.length} productos`;
        document.getElementById('prod-table-wrap').innerHTML = productsTable(products);
      } catch {
        document.getElementById('prod-table-wrap').textContent = 'Error al cargar.';
      }
    }

    function productsTable(products) {
      if (!products.length) return `<p style="padding:var(--sp-8);text-align:center;color:var(--clr-text-muted)">Sin productos todavía.</p>`;
      return `<table>
        <thead><tr>
          <th>Nombre</th>
          <th>Presentación</th>
          <th>Precio venta</th>
          <th>Costo</th>
          <th>Stock</th>
          <th>Estado</th>
        </tr></thead>
        <tbody>
          ${products.map(p => `<tr>
            <td style="font-weight:var(--fw-semibold)">${p.name}${p.description ? `<br><small style="font-weight:var(--fw-normal);color:var(--clr-text-muted)">${p.description}</small>` : ''}</td>
            <td style="color:var(--clr-text-muted)">${p.unit_amount}</td>
            <td>${fmtCents(p.price_cents)}</td>
            <td style="color:var(--clr-text-muted)">${p.cost_price != null ? fmtCents(p.cost_price) : '—'}</td>
            <td>${p.stock} uds.</td>
            <td>${stockStatusBadge(p.stock_status)}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    function statSkeleton() {
      return `<div class="stat-card" style="opacity:.35">
        <div style="background:var(--clr-surface-2);height:10px;width:60%;border-radius:var(--radius-sm)"></div>
        <div style="background:var(--clr-surface-2);height:30px;width:50%;border-radius:var(--radius-sm);margin-top:var(--sp-2)"></div>
      </div>`;
    }

    renderPage('dashboard');
  </script>
</body>
</html>
