server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(auth|orders|products|users) {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
    }

    # Uncomment after DNS is pointed and certbot has run:
    # return 301 https://$host$request_uri;
}

