<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gordo</title>
  <style>
    /* ── Reset & Tokens ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0f;
      --surface:   #1a1a1a;
      --border:    #2a2a2a;
      --accent:    #e8c547;
      --accent-dim:#b89a30;
      --text:      #f0f0f0;
      --muted:     #888;
      --radius:    10px;
      --nav-h:     60px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Nav ────────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      background: rgba(15,15,15,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 1.5rem;
    }

    .nav-brand {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -.5px;
      color: var(--accent);
      text-decoration: none;
      margin-right: auto;
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: .9rem;
      transition: color .15s;
    }
    .nav-links a:hover { color: var(--text); }

    .btn-login {
      padding: .45rem 1.1rem;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: var(--radius);
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .btn-login:hover { background: var(--accent); color: #000; }

    /* hamburger – mobile only */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: transform .2s, opacity .2s;
    }

    /* ── Hero ───────────────────────────────────────────────── */
    .hero {
      padding: 4rem 1.5rem 3rem;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
    }
    .hero h1 span { color: var(--accent); }
    .hero p {
      margin-top: .75rem;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 480px;
      margin-inline: auto;
    }

    /* ── Products section ───────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      margin-bottom: 1.25rem;
    }
    .section-header h2 { font-size: 1.1rem; font-weight: 700; }
    .section-header span { font-size: .85rem; color: var(--muted); }

    /* ── Grid ───────────────────────────────────────────────── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      padding: 0 1.5rem 3rem;
    }

    /* card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .15s, border-color .15s;
    }
    .card:hover { transform: translateY(-3px); border-color: #444; }

    .card-img {
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 2rem;
    }

    .card-body {
      padding: .9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      flex: 1;
    }

    .card-name {
      font-size: .95rem;
      font-weight: 600;
      line-height: 1.3;
      /* clamp to 2 lines */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: auto;
    }

    .btn-add {
      margin: 0 1rem 1rem;
      padding: .55rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: .875rem;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-add:hover { background: var(--accent-dim); }

    /* skeleton */
    .skeleton { animation: pulse 1.4s ease-in-out infinite; }
    .skeleton .card-img  { background: var(--border); }
    .skeleton .card-name { height: 14px; background: var(--border); border-radius: 4px; }
    .skeleton .card-price { height: 18px; width: 60px; background: var(--border); border-radius: 4px; margin-top: .5rem; }
    .skeleton .btn-add  { background: var(--border); color: transparent; pointer-events: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .45; }
    }

    /* error / empty */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }
    .state-msg .icon { font-size: 2.5rem; margin-bottom: .5rem; }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
    }

    /* ── Mobile overrides ───────────────────────────────────── */
    @media (max-width: 640px) {
      .nav-links { display: none; }

      .nav-links.open {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: var(--nav-h);
        left: 0; right: 0;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 1rem 1.5rem;
        gap: 1rem;
      }

      .hamburger { display: flex; }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: .75rem;
        padding: 0 .75rem 2rem;
      }

      .section-header { padding: 0 .75rem; }

      .hero { padding: 2.5rem 1rem 2rem; }
    }

    @media (max-width: 380px) {
      .products-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ── Nav ── -->
  <nav>
    <a href="/" class="nav-brand">Gordo</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="#">Products</a></li>
      <li><a href="#">Who We Are</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <a href="/login.html" class="btn-login">Login / Admin</a>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ── Hero ── -->
  <section class="hero">
    <h1>Quality you can <span>taste.</span></h1>
    <p>Hand-picked products, delivered fresh.</p>
  </section>

  <!-- ── Products ── -->
  <main>
    <div class="section-header">
      <h2>All Products</h2>
      <span id="product-count"></span>
    </div>
    <div class="products-grid" id="grid"></div>
  </main>

  <footer>
    &copy; <span id="yr"></span> Gordo. All rights reserved.
  </footer>

  <script>
    const API = 'http://localhost:3000';

    // ── Hamburger ──
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('nav-links').classList.toggle('open');
    });

    // ── Year ──
    document.getElementById('yr').textContent = new Date().getFullYear();

    // ── Helpers ──
    function fmtPrice(n) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
    }

    function skeletonCard() {
      return `<div class="card skeleton">
        <div class="card-img"></div>
        <div class="card-body">
          <div class="card-name"></div>
          <div class="card-price"></div>
        </div>
        <button class="btn-add">Add to cart</button>
      </div>`;
    }

    function productCard(p) {
      return `<div class="card" data-id="${p.id}">
        <div class="card-img">🛒</div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-price">${fmtPrice(p.price)}</div>
        </div>
        <button class="btn-add" onclick="addToCart('${p.id}', '${p.name}')">Add to cart</button>
      </div>`;
    }

    // ── Load products ──
    async function loadProducts() {
      const grid = document.getElementById('grid');

      // show 6 skeletons while loading
      grid.innerHTML = Array(6).fill(skeletonCard()).join('');

      try {
        const res = await fetch(`${API}/products/`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const products = await res.json();

        if (products.length === 0) {
          grid.innerHTML = `<div class="state-msg"><div class="icon">📦</div>No products yet.</div>`;
          return;
        }

        document.getElementById('product-count').textContent = `${products.length} items`;
        grid.innerHTML = products.map(productCard).join('');
      } catch (err) {
        grid.innerHTML = `<div class="state-msg">
          <div class="icon">⚠️</div>
          Could not load products. Is the API running?<br>
          <small style="margin-top:.5rem;display:block">${err.message}</small>
        </div>`;
      }
    }

    function addToCart(id, name) {
      // placeholder — wire up real cart logic later
      console.log('add to cart', id, name);
      const btn = document.querySelector(`.card[data-id="${id}"] .btn-add`);
      btn.textContent = 'Added ✓';
      setTimeout(() => btn.textContent = 'Add to cart', 1500);
    }

    loadProducts();
  </script>
</body>
</html>
