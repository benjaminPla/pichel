<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pichel — Almacén Saludable</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <nav class="topnav">
    <a href="/" class="nav-brand">Pichel</a>
    <ul class="topnav-links">
      <li><a href="/">Precios</a></li>
      <li><a href="/como-comprar.html">Cómo comprar</a></li>
      <li><a href="/referencias.html">Referencias</a></li>
      <li><a href="/nosotros.html">Nosotros</a></li>
      <li><a href="/contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>Dietética <span>natural de barrio.</span></h1>
    <p>Productos a granel · Frutos secos · Semillas · Hierbas</p>
  </section>

  <section id="precios">
    <div class="price-list-wrap">
      <div class="section-header" style="padding:0;margin-bottom:var(--sp-5)">
        <h2>Lista de precios</h2>
        <div style="text-align:right">
          <div id="product-count" class="text-muted"></div>
          <div id="list-updated" style="font-size:var(--text-xs);color:var(--clr-text-muted);margin-top:2px"></div>
        </div>
      </div>
      <div id="list-wrap">
        <div class="price-list-skeleton">
          <div class="pl-skeleton-row"></div><div class="pl-skeleton-row"></div>
          <div class="pl-skeleton-row"></div><div class="pl-skeleton-row"></div>
          <div class="pl-skeleton-row"></div><div class="pl-skeleton-row"></div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    &copy; <span id="yr"></span> Pichel · Dietética Natural de Barrio
  </footer>

  <script>
    const API = '';
    document.getElementById('yr').textContent = new Date().getFullYear();

    const SYMBOL_DEFS = {
      vegan:         { icon: '🌱', name: 'Vegano'                },
      vegetarian:    { icon: '🥕', name: 'Vegetariano'           },
      gluten_free:   { icon: '🌾', name: 'Sin TACC'              },
      organic:       { icon: '🌿', name: 'Orgánico'              },
      lactose_free:  { icon: '🥛', name: 'Sin lactosa'           },
      sugar_free:    { icon: '🍃', name: 'Sin azúcar agregada'   },
      contains_nuts: { icon: '🥜', name: 'Contiene frutos secos' },
      high_protein:  { icon: '💪', name: 'Alto en proteína'      },
      no_added_salt: { icon: '🧂', name: 'Sin sal agregada'      },
    };

    function fmtCents(cents) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(cents / 100);
    }

    function fmtDate(d) {
      return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' })
        + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }

    function symbolPills(symbols) {
      if (!symbols || !symbols.length) return '';
      const pills = symbols.map(s => {
        const def = SYMBOL_DEFS[s];
        if (!def) return '';
        return `<span class="pl-sym" data-name="${def.name}">${def.icon}</span>`;
      }).filter(Boolean).join('');
      return pills ? `<span class="pl-symbols">${pills}</span>` : '';
    }

    function modeLabel(p) {
      if (p.sale_mode === 'bulk') return `<span class="pl-mode pl-mode-bulk">A granel</span>`;
      if (p.sale_mode === 'unit') return `<span class="pl-mode pl-mode-pkg">Unidad</span>`;
      return `<span class="pl-mode">${p.sale_mode}</span>`;
    }

    function fmtPrice(p) {
      if (p.sale_mode === 'bulk') {
        return `${fmtCents(p.price_cents)}<span class="pl-price-unit"> / kg</span>`;
      }
      return fmtCents(p.price_cents);
    }

    function groupByName(products) {
      const groups = [];
      for (const p of products) {
        const last = groups[groups.length - 1];
        if (last && last.name === p.name) last.variants.push(p);
        else groups.push({ name: p.name, variants: [p] });
      }
      return groups;
    }

    function renderGroup(group) {
      const main = group.variants[0];
      const imgCell = main.image_url
        ? `<img src="${main.image_url}" alt="${main.name}" class="pl-thumb">`
        : `<div class="pl-thumb pl-thumb-empty">🌿</div>`;
      const nameCell = `
        <span>${main.name}</span>
        ${main.description ? `<span class="pl-desc">${main.description}</span>` : ''}
        ${symbolPills(main.symbols)}`;

      if (group.variants.length === 1) {
        return `<tbody><tr>
          <td class="pl-img-cell">${imgCell}</td>
          <td class="pl-name">${nameCell}</td>
          <td class="pl-unit">${modeLabel(main)}</td>
          <td class="pl-price">${fmtPrice(main)}</td>
        </tr></tbody>`;
      }

      const rows = group.variants.map((p, i) => {
        if (i === 0) {
          return `<tr>
            <td class="pl-img-cell" rowspan="${group.variants.length}">${imgCell}</td>
            <td class="pl-name" rowspan="${group.variants.length}">${nameCell}</td>
            <td class="pl-unit">${modeLabel(p)}</td>
            <td class="pl-price">${fmtPrice(p)}</td>
          </tr>`;
        }
        return `<tr class="pl-row-variant">
          <td class="pl-unit">${modeLabel(p)}</td>
          <td class="pl-price">${fmtPrice(p)}</td>
        </tr>`;
      }).join('');
      return `<tbody>${rows}</tbody>`;
    }

    let currentPage = 1;
    const PER_PAGE  = 50;

    function priceTable(products) {
      const groups = groupByName(products);
      return `
        <table class="price-list">
          <thead><tr>
            <th></th>
            <th>Producto</th>
            <th>Modalidad</th>
            <th>Precio</th>
          </tr></thead>
          ${groups.map(renderGroup).join('')}
        </table>`;
    }

    function paginationBar(page, totalPages) {
      if (totalPages <= 1) return '';
      return `
        <div class="pagination">
          <button class="pagination-btn" onclick="loadPriceList(${page - 1})" ${page <= 1 ? 'disabled' : ''}>← Anterior</button>
          <span class="pagination-info">Página ${page} de ${totalPages}</span>
          <button class="pagination-btn" onclick="loadPriceList(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>Siguiente →</button>
        </div>`;
    }

    async function loadPriceList(page = 1) {
      currentPage = page;
      const wrap  = document.getElementById('list-wrap');
      try {
        const res = await fetch(`${API}/products?page=${page}&per_page=${PER_PAGE}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { products, total } = await res.json();
        const total_pages = Math.ceil(total / PER_PAGE);
        document.getElementById('product-count').textContent = `${total} productos`;
        document.getElementById('list-updated').textContent  = `Actualizada el ${fmtDate(new Date())}`;
        if (!products.length) { wrap.innerHTML = `<p class="pl-empty">Sin productos por ahora.</p>`; return; }
        wrap.innerHTML = priceTable(products) + paginationBar(page, total_pages);
      } catch (_err) {
        wrap.innerHTML = `<p class="pl-empty">No se pudo cargar la lista.</p>`;
      }
    }

    loadPriceList();
  </script>
</body>
</html>
