<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pichel — Almacén Saludable</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ── Nav ── -->
  <nav>
    <a href="/" class="nav-brand">Pichel</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="#">Productos</a></li>
      <li><a href="#">Quiénes somos</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
    <a href="/login.html" class="btn-login">Ingresar</a>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ── Hero ── -->
  <section class="hero">
    <h1>Lo natural, <span>de tu barrio.</span></h1>
    <p>Productos a granel, frutos secos, semillas y mucho más.</p>
  </section>

  <!-- ── Products ── -->
  <main>
    <div class="section-header">
      <h2>Todos los productos</h2>
      <span id="product-count"></span>
    </div>
    <div class="products-grid" id="grid"></div>
  </main>

  <footer>
    &copy; <span id="yr"></span> Pichel · Dietética Natural de Barrio
  </footer>

  <script>
    const API = '';

    // ── Hamburger ──
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('nav-links').classList.toggle('open');
    });

    // ── Year ──
    document.getElementById('yr').textContent = new Date().getFullYear();

    // ── Helpers ──
    function fmtCents(cents) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(cents / 100);
    }

    function skeletonCard() {
      return `<div class="card skeleton">
        <div class="card-img"></div>
        <div class="card-body">
          <div class="card-name"></div>
          <div class="card-price"></div>
        </div>
        <button class="btn-add">Agregar</button>
      </div>`;
    }

    function productCard(p) {
      const img = p.image_url
        ? `<img src="${p.image_url}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover">`
        : `🌿`;
      return `<div class="card" data-id="${p.id}">
        <div class="card-img">${img}</div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          ${p.description ? `<div style="font-size:var(--text-xs);color:var(--clr-text-muted);margin-top:var(--sp-1)">${p.description}</div>` : ''}
          <div style="font-size:var(--text-xs);color:var(--clr-text-muted);margin-top:var(--sp-1)">${p.unit_amount}</div>
          <div class="card-price">${fmtCents(p.price_cents)}</div>
        </div>
        <button class="btn-add" onclick="addToCart('${p.id}', '${p.name}')">Agregar al carrito</button>
      </div>`;
    }

    // ── Load products ──
    async function loadProducts() {
      const grid = document.getElementById('grid');

      grid.innerHTML = Array(6).fill(skeletonCard()).join('');

      try {
        const res = await fetch(`${API}/products`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const products = await res.json();

        if (products.length === 0) {
          grid.innerHTML = `<div class="state-msg"><div class="icon">📦</div>Sin productos por ahora.</div>`;
          return;
        }

        document.getElementById('product-count').textContent = `${products.length} productos`;
        grid.innerHTML = products.map(productCard).join('');
      } catch (err) {
        grid.innerHTML = `<div class="state-msg">
          <div class="icon">⚠️</div>
          No se pudo cargar el catálogo. ¿Está corriendo la API?<br>
          <small style="margin-top:var(--sp-2);display:block">${err.message}</small>
        </div>`;
      }
    }

    function addToCart(id, name) {
      console.log('add to cart', id, name);
      const btn = document.querySelector(`.card[data-id="${id}"] .btn-add`);
      btn.textContent = 'Agregado ✓';
      setTimeout(() => btn.textContent = 'Agregar al carrito', 1500);
    }

    loadProducts();
  </script>
</body>
</html>
