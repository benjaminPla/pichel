<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pichel — Almacén Saludable</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <nav class="topnav">
    <a href="/" class="nav-brand">Pichel</a>
    <ul class="topnav-links">
      <li><a href="/">Precios</a></li>
      <li><a href="/como-comprar.html">Cómo comprar</a></li>
      <li><a href="/referencias.html">Referencias</a></li>
      <li><a href="/nosotros.html">Nosotros</a></li>
      <li><a href="/contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>Dietética <span>natural de barrio.</span></h1>
    <p>Productos a granel · Frutos secos · Semillas · Hierbas</p>
  </section>

  <section id="precios">
    <div class="section-header">
      <h2>Lista de precios</h2>
      <div class="text-right">
        <div id="product-count" class="text-muted"></div>
        <div id="list-updated" class="list-updated"></div>
      </div>
    </div>
    <div id="list-wrap">
      <div class="products-grid" id="products-skeleton">
        ${Array(6).fill('<div class="product-card skeleton"><div class="pc-img"></div><div class="pc-body"><div class="card-name"></div><div class="card-price"></div></div></div>').join('')}
      </div>
    </div>
  </section>

  <footer>
    &copy; <span id="yr"></span> Pichel · Dietética Natural de Barrio
  </footer>

  <!-- Cart overlay -->
  <div class="cart-overlay" id="cart-overlay"></div>

  <!-- Cart drawer -->
  <div class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Tu pedido">
    <div class="cart-drawer-header">
      <h3>Tu pedido</h3>
      <button class="cart-close" id="cart-close" aria-label="Cerrar carrito">✕</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total estimado</span>
        <strong id="cart-total">$0</strong>
      </div>
      <div class="cart-form">
        <input type="tel"   id="cart-phone" placeholder="📱 Teléfono (requerido)" autocomplete="tel" />
        <input type="email" id="cart-email" placeholder="Email (requerido)"        autocomplete="email" />
        <input type="text"  id="cart-name"  placeholder="Nombre (opcional)"        autocomplete="name" />
        <button class="btn-wpp-submit" id="cart-submit" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.532 5.845L.057 23.885a.5.5 0 0 0 .61.61l6.04-1.475A11.954 11.954 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 0 1-5.032-1.382l-.36-.214-3.733.911.927-3.63-.234-.375A9.785 9.785 0 0 1 2.182 12C2.182 6.576 6.576 2.182 12 2.182S21.818 6.576 21.818 12 17.424 21.818 12 21.818z"/></svg>
          Enviar pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Cart FAB -->
  <button class="cart-fab" id="cart-fab" aria-label="Ver carrito">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </svg>
    <span class="cart-fab-badge" id="cart-badge">0</span>
  </button>

  <script>
    // ── Config ──────────────────────────────────────────────────
    const API        = '';
    const WA_NUMBER  = '5492236045733'; // ← número WhatsApp del local
    const CART_KEY   = 'pichel_cart';
    const CART_TTL   = 15 * 24 * 60 * 60 * 1000;

    document.getElementById('yr').textContent = new Date().getFullYear();

    // ── State ───────────────────────────────────────────────────
    let cart     = {};   // { [id]: { id, name, price_cents, sale_mode, quantity } }
    let products = [];

    // ── Cart persistence ────────────────────────────────────────
    function cartLoad() {
      try {
        const raw  = localStorage.getItem(CART_KEY);
        if (!raw) return {};
        const data = JSON.parse(raw);
        if (Date.now() - data.savedAt > CART_TTL) { localStorage.removeItem(CART_KEY); return {}; }
        return data.items || {};
      } catch { return {}; }
    }

    function cartSave() {
      localStorage.setItem(CART_KEY, JSON.stringify({ savedAt: Date.now(), items: cart }));
    }

    function cartSet(id, qty) {
      if (qty <= 0) { delete cart[id]; }
      else {
        const p = products.find(p => p.id === id);
        if (!p) return;
        cart[id] = { id, name: p.name, price_cents: p.price_cents, sale_mode: p.sale_mode, quantity: qty };
      }
      cartSave();
      updateFab();
    }

    // ── Format helpers ──────────────────────────────────────────
    function fmtCents(cents) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(cents / 100);
    }

    function fmtDate(d) {
      return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' })
           + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }

    function fmtQty(item) {
      if (item.sale_mode === 'bulk') {
        const g = item.quantity;
        return g >= 1000 ? `${g}g (${(g / 1000).toFixed(1).replace(/\.0$/, '')}kg)` : `${g}g`;
      }
      return item.quantity === 1 ? '1 unidad' : `${item.quantity} unidades`;
    }

    function calcSubtotal(item) {
      return item.sale_mode === 'bulk'
        ? Math.ceil(item.price_cents * item.quantity / 1000)
        : item.price_cents * item.quantity;
    }

    // ── FAB ─────────────────────────────────────────────────────
    function updateFab() {
      const count = Object.keys(cart).length;
      const badge = document.getElementById('cart-badge');
      badge.textContent   = count;
      badge.style.display = count ? 'flex' : 'none';
    }

    // ── Cart open / close ───────────────────────────────────────
    document.getElementById('cart-fab').addEventListener('click', openCart);
    document.getElementById('cart-close').addEventListener('click', closeCart);
    document.getElementById('cart-overlay').addEventListener('click', closeCart);

    function openCart() {
      renderCartDrawer();
      document.getElementById('cart-overlay').classList.add('open');
      document.getElementById('cart-drawer').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeCart() {
      document.getElementById('cart-overlay').classList.remove('open');
      document.getElementById('cart-drawer').classList.remove('open');
      document.body.style.overflow = '';
    }

    // ── Cart drawer render ──────────────────────────────────────
    function renderCartDrawer() {
      const items = Object.values(cart);
      const el    = document.getElementById('cart-items');

      if (!items.length) {
        el.innerHTML = `<p class="cart-empty">Tu carrito está vacío 🛒</p>`;
        document.getElementById('cart-total').textContent  = fmtCents(0);
        document.getElementById('cart-submit').disabled    = true;
        return;
      }

      let total = 0;
      el.innerHTML = items.map(item => {
        const sub = calcSubtotal(item);
        total += sub;
        const step = 1;
        return `<div class="cart-item">
          <div class="ci-info">
            <span class="ci-name">${item.name}</span>
            <span class="ci-qty-label">${fmtQty(item)}</span>
          </div>
          <div class="ci-right">
            <div class="ci-stepper">
              <button class="qty-btn" onclick="ciAdjust('${item.id}',-${step})">−</button>
              <span class="ci-qty-val">${item.quantity}${item.sale_mode === 'bulk' ? 'g' : ''}</span>
              <button class="qty-btn" onclick="ciAdjust('${item.id}',${step})">+</button>
            </div>
            <span class="ci-sub">${fmtCents(sub)}</span>
            <button class="ci-remove" onclick="ciRemove('${item.id}')" aria-label="Eliminar">✕</button>
          </div>
        </div>`;
      }).join('');

      document.getElementById('cart-total').textContent = fmtCents(total);
      document.getElementById('cart-submit').disabled   = false;
    }

    function ciAdjust(id, delta) {
      const item = cart[id];
      if (!item) return;
      const newQty = item.quantity + delta;
      if (newQty <= 0) { ciRemove(id); return; }
      cartSet(id, newQty);
      syncCardStepper(id);
      renderCartDrawer();
    }

    function ciRemove(id) {
      delete cart[id];
      cartSave();
      updateFab();
      syncCardStepper(id);
      renderCartDrawer();
    }

    // ── Product card stepper sync ───────────────────────────────
    function syncCardStepper(id) {
      const item    = cart[id];
      const qty     = item ? item.quantity : 0;
      const addBtn  = document.getElementById(`add-${id}`);
      const stepper = document.getElementById(`stepper-${id}`);
      const input   = document.getElementById(`qty-${id}`);
      if (!addBtn) return;
      if (qty > 0) {
        addBtn.style.display  = 'none';
        stepper.style.display = 'flex';
        input.value = qty;
        refreshQtyDisplay(id, qty);
      } else {
        addBtn.style.display  = '';
        stepper.style.display = 'none';
        const hintEl = document.getElementById(`hint-${id}`);
        const subEl  = document.getElementById(`sub-${id}`);
        if (hintEl) hintEl.style.display = 'none';
        if (subEl)  subEl.style.display  = 'none';
      }
    }

    function refreshQtyDisplay(id, qty) {
      const p      = products.find(p => p.id === id);
      const hintEl = document.getElementById(`hint-${id}`);
      const subEl  = document.getElementById(`sub-${id}`);
      if (!p || !hintEl || !subEl) return;

      if (p.sale_mode === 'bulk') {
        hintEl.textContent = qty >= 1000
          ? `${qty}g (${(qty / 1000).toFixed(1).replace(/\.0$/, '')}kg)`
          : `${qty}g`;
        subEl.textContent = fmtCents(Math.ceil(p.price_cents * qty / 1000));
      } else {
        hintEl.textContent = qty === 1 ? '1 unidad' : `${qty} unidades`;
        subEl.textContent  = fmtCents(p.price_cents * qty);
      }
      hintEl.style.display = 'block';
      subEl.style.display  = 'block';
    }

    // ── Add / adjust from product card ──────────────────────────
    function addToCart(id) {
      const p = products.find(p => p.id === id);
      if (!p) return;
      cartSet(id, p.sale_mode === 'bulk' ? 100 : 1);
      syncCardStepper(id);
    }

    function adjustQty(id, delta) {
      const item   = cart[id];
      const newQty = (item ? item.quantity : 0) + delta;
      if (newQty <= 0) { ciRemove(id); syncCardStepper(id); return; }
      cartSet(id, newQty);
      syncCardStepper(id);
    }

    function onQtyInput(id, value) {
      const qty = parseInt(value) || 0;
      if (qty <= 0) { ciRemove(id); syncCardStepper(id); return; }
      cartSet(id, qty);
      refreshQtyDisplay(id, qty);
    }

    // ── Order submission ────────────────────────────────────────
    document.getElementById('cart-submit').addEventListener('click', submitOrder);

    async function submitOrder() {
      const phoneEl = document.getElementById('cart-phone');
      const emailEl = document.getElementById('cart-email');
      const phone   = phoneEl.value.trim();
      const email   = emailEl.value.trim();

      let hasError = false;
      [{ el: phoneEl, val: phone }, { el: emailEl, val: email }].forEach(({ el, val }) => {
        if (!val) {
          hasError = true;
          el.classList.add('input-error');
          el.addEventListener('input', () => el.classList.remove('input-error'), { once: true });
        }
      });
      if (hasError) { phoneEl.value ? emailEl.focus() : phoneEl.focus(); return; }

      const name  = document.getElementById('cart-name').value.trim() || null;
      const items = Object.values(cart);
      if (!items.length) return;

      const btn = document.getElementById('cart-submit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Enviando…';

      // Record order in backend (best-effort — don't block WA on failure)
      try {
        await fetch(`${API}/orders`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customer_phone: phone,
            customer_email: email,
            customer_name:  name,
            items: items.map(i => ({ product_id: i.id, quantity: i.quantity })),
          }),
        });
      } catch (_) { /* silent — WA still opens */ }

      // Build WhatsApp message — triple backticks force monospace so padEnd alignment works
      const total     = items.reduce((s, i) => s + calcSubtotal(i), 0);
      const nameW     = Math.max(...items.map(i => i.name.length));
      const qtyW      = Math.max(...items.map(i => fmtQty(i).length));
      const tableRows = items.map(i => {
        const sub = calcSubtotal(i);
        return `${i.name.padEnd(nameW)}  ${fmtQty(i).padEnd(qtyW)}  ${fmtCents(sub)}`;
      });
      const msgParts = [
        '*Nuevo pedido — Pichel*',
        '',
        '```',
        ...tableRows,
        '```',
        '',
        `Total: ${fmtCents(total)}`,
        '',
        'Cliente',
        `Tel: ${phone}`,
        `Email: ${email}`,
        ...(name ? [`Nombre: ${name}`] : []),
      ];
      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msgParts.join('\n'))}`, '_blank');

      // Clear cart
      const clearedIds = Object.keys(cart);
      cart = {};
      cartSave();
      updateFab();
      clearedIds.forEach(id => syncCardStepper(id));
      closeCart();

      // Reset form
      ['cart-phone', 'cart-email', 'cart-name'].forEach(id => { document.getElementById(id).value = ''; });
      btn.disabled  = false;
      btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.532 5.845L.057 23.885a.5.5 0 0 0 .61.61l6.04-1.475A11.954 11.954 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 0 1-5.032-1.382l-.36-.214-3.733.911.927-3.63-.234-.375A9.785 9.785 0 0 1 2.182 12C2.182 6.576 6.576 2.182 12 2.182S21.818 6.576 21.818 12 17.424 21.818 12 21.818z"/></svg> Enviar pedido por WhatsApp`;
    }

    // ── Symbols ─────────────────────────────────────────────────
    const SYMBOL_DEFS = {
      vegan:         { icon: '🌱', name: 'Vegano'                },
      vegetarian:    { icon: '🥕', name: 'Vegetariano'           },
      gluten_free:   { icon: '🌾', name: 'Sin TACC'              },
      organic:       { icon: '🌿', name: 'Orgánico'              },
      lactose_free:  { icon: '🥛', name: 'Sin lactosa'           },
      sugar_free:    { icon: '🍃', name: 'Sin azúcar agregada'   },
      contains_nuts: { icon: '🥜', name: 'Contiene frutos secos' },
      high_protein:  { icon: '💪', name: 'Alto en proteína'      },
      no_added_salt: { icon: '🧂', name: 'Sin sal agregada'      },
    };

    function symbolPills(symbols) {
      if (!symbols || !symbols.length) return '';
      return symbols.map(s => {
        const def = SYMBOL_DEFS[s];
        return def ? `<span class="pl-sym" data-name="${def.name}">${def.icon}</span>` : '';
      }).filter(Boolean).join('');
    }

    // ── Product card render ──────────────────────────────────────
    function renderCard(p) {
      const inCart = cart[p.id];
      const qty    = inCart ? inCart.quantity : 0;

      const imgHtml = p.image_url
        ? `<img class="pc-img" src="${p.image_url}" alt="${p.name}" loading="lazy">`
        : `<div class="pc-img-empty">🌿</div>`;

      const modeBadge = p.sale_mode === 'bulk'
        ? `<span class="pl-mode pl-mode-bulk">A granel</span>`
        : `<span class="pl-mode pl-mode-pkg">Unidad</span>`;

      const priceHtml = p.sale_mode === 'bulk'
        ? `${fmtCents(p.price_cents)}<span class="pl-price-unit">/kg</span>`
        : fmtCents(p.price_cents);

      const syms  = symbolPills(p.symbols);
      const hint  = qty > 0 ? (p.sale_mode === 'bulk'
        ? (qty >= 1000 ? `${qty}g (${(qty / 1000).toFixed(1).replace(/\.0$/, '')}kg)` : `${qty}g`)
        : (qty === 1 ? '1 unidad' : `${qty} unidades`)) : '';
      const sub   = qty > 0 ? fmtCents(p.sale_mode === 'bulk'
        ? Math.ceil(p.price_cents * qty / 1000)
        : p.price_cents * qty) : '';

      return `<div class="product-card" id="card-${p.id}">
        ${imgHtml}
        <div class="pc-body">
          <div class="pc-name">${p.name}</div>
          ${p.description ? `<div class="pc-desc">${p.description}</div>` : ''}
          ${syms ? `<div class="pc-symbols">${syms}</div>` : ''}
          <div class="pc-meta">
            ${modeBadge}
            <span class="pc-price">${priceHtml}</span>
          </div>
          <div class="qty-stepper" id="stepper-${p.id}" style="display:${qty > 0 ? 'flex' : 'none'}">
            <button class="qty-btn" onclick="adjustQty('${p.id}',-1)">−</button>
            <input  class="qty-input" type="number" min="0" step="1" value="${qty}"
                    id="qty-${p.id}" oninput="onQtyInput('${p.id}',this.value)">
            <button class="qty-btn" onclick="adjustQty('${p.id}',1)">+</button>
            ${p.sale_mode === 'bulk' ? '<span class="qty-unit">g</span>' : ''}
          </div>
          <button class="btn-cart-add" id="add-${p.id}" onclick="addToCart('${p.id}')"
                  style="display:${qty > 0 ? 'none' : ''}">Agregar</button>
          <div class="qty-hint"     id="hint-${p.id}" style="display:${hint ? 'block' : 'none'}">${hint}</div>
          <div class="qty-subtotal" id="sub-${p.id}"  style="display:${sub ? 'block' : 'none'}">${sub}</div>
        </div>
      </div>`;
    }

    // ── Load products ────────────────────────────────────────────
    let currentPage = 1;
    const PER_PAGE  = 50;

    function paginationBar(page, totalPages) {
      if (totalPages <= 1) return '';
      return `<div class="pagination">
        <button class="pagination-btn" onclick="loadProducts(${page - 1})" ${page <= 1 ? 'disabled' : ''}>← Anterior</button>
        <span class="pagination-info">Página ${page} de ${totalPages}</span>
        <button class="pagination-btn" onclick="loadProducts(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>Siguiente →</button>
      </div>`;
    }

    async function loadProducts(page = 1) {
      currentPage = page;
      const wrap  = document.getElementById('list-wrap');
      try {
        const res = await fetch(`${API}/products?page=${page}&per_page=${PER_PAGE}`);
        if (!res.ok) throw new Error();
        const { products: data, total, price_list_updated_at } = await res.json();
        products = data;
        const totalPages = Math.ceil(total / PER_PAGE);
        document.getElementById('product-count').textContent = `${total} productos`;
        if (price_list_updated_at) {
          document.getElementById('list-updated').textContent = `Actualizada el ${fmtDate(new Date(price_list_updated_at))}`;
        }
        if (!products.length) {
          wrap.innerHTML = `<p class="pl-empty">Sin productos por ahora.</p>`;
          return;
        }
        wrap.innerHTML = `<div class="products-grid">${products.map(renderCard).join('')}</div>` + paginationBar(page, totalPages);
        // Restore cart state on cards
        Object.keys(cart).forEach(id => syncCardStepper(id));
      } catch {
        wrap.innerHTML = `<p class="pl-empty">No se pudo cargar la lista.</p>`;
      }
    }

    // ── Init ────────────────────────────────────────────────────
    cart = cartLoad();
    updateFab();
    loadProducts();
  </script>
</body>
</html>
