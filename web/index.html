<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pichel — Almacén Saludable</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <nav class="topnav">
    <a href="/" class="nav-brand">Pichel</a>
  </nav>

  <section class="hero">
    <h1>Lista de <span>precios.</span></h1>
    <p>Productos naturales · A granel · Frutos secos · Herbas</p>
  </section>

  <main>
    <div class="price-list-wrap" id="list-wrap">
      <div class="price-list-skeleton">
        ${Array(8).fill('<div class="pl-skeleton-row"></div>').join('')}
      </div>
    </div>
  </main>

  <footer>
    &copy; <span id="yr"></span> Pichel · Dietética Natural de Barrio
  </footer>

  <script>
    const API = '';

    document.getElementById('yr').textContent = new Date().getFullYear();

    function fmtCents(cents) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(cents / 100);
    }

    async function loadPriceList() {
      const wrap = document.getElementById('list-wrap');

      try {
        const res = await fetch(`${API}/products`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const products = await res.json();

        if (!products.length) {
          wrap.innerHTML = `<p class="pl-empty">Sin productos por ahora.</p>`;
          return;
        }

        wrap.innerHTML = `
          <table class="price-list">
            <thead>
              <tr>
                <th></th>
                <th>Producto</th>
                <th>Presentación</th>
                <th>Precio</th>
              </tr>
            </thead>
            <tbody>
              ${products.map(p => `
                <tr>
                  <td class="pl-img-cell">
                    ${p.image_url
                      ? `<img src="${p.image_url}" alt="${p.name}" class="pl-thumb">`
                      : `<div class="pl-thumb pl-thumb-empty">🌿</div>`}
                  </td>
                  <td class="pl-name">${p.name}${p.description ? `<span class="pl-desc">${p.description}</span>` : ''}</td>
                  <td class="pl-unit">${p.unit_amount}</td>
                  <td class="pl-price">${fmtCents(p.price_cents)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      } catch (err) {
        wrap.innerHTML = `<p class="pl-empty">No se pudo cargar la lista. ¿Está corriendo la API?<br><small>${err.message}</small></p>`;
      }
    }

    loadPriceList();
  </script>
</body>
</html>
