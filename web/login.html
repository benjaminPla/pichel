<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — Pichel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="layout-auth">
  <div class="card card-form">
    <a href="/" class="brand">Pichel</a>
    <h1 class="auth-subtitle">Panel de administración</h1>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@pichel.com" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button class="btn btn-primary" style="width:100%;padding:var(--sp-3);font-size:var(--text-base);margin-top:var(--sp-2)" type="submit" id="submit-btn">
        Ingresar
      </button>
    </form>

    <p class="footer-link"><a href="/">← Volver a la tienda</a></p>
  </div>

  <script>
    const API = '';

    if (localStorage.getItem('token')) {
      window.location.href = '/admin/';
    }

    const form      = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg  = document.getElementById('error-msg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }
    function clearError() {
      errorMsg.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Email y contraseña son requeridos.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Ingresando…';

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        if (res.status === 401) { showError('Email o contraseña incorrectos.'); return; }
        if (!res.ok)             { showError(`Error del servidor (${res.status}). Intentá de nuevo.`); return; }

        const { token } = await res.json();
        localStorage.setItem('token', token);
        window.location.href = '/admin/';

      } catch {
        showError('No se pudo conectar con el servidor. ¿Está corriendo la API?');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Ingresar';
      }
    });
  </script>
</body>
</html>
