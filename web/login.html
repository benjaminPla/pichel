<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Pichel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --accent:   #e8c547;
      --text:     #f0f0f0;
      --muted:    #888;
      --error:    #e55;
      --radius:   10px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.25rem 2rem;
    }

    .brand {
      display: block;
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -.5px;
      text-decoration: none;
      margin-bottom: .5rem;
    }

    .card h1 {
      text-align: center;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .field { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: .4rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: .7rem .9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: #444; }

    .btn {
      width: 100%;
      padding: .75rem;
      margin-top: .5rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn:hover  { background: #cfa830; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      display: none;
      background: rgba(238,85,85,.12);
      border: 1px solid rgba(238,85,85,.3);
      color: var(--error);
      border-radius: var(--radius);
      padding: .65rem .9rem;
      font-size: .875rem;
      margin-bottom: 1rem;
    }
    .error-msg.show { display: block; }

    .footer-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: .85rem;
      color: var(--muted);
    }
    .footer-link a { color: var(--accent); text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }

    /* spinner inside button */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="brand">Pichel</a>
    <h1>Admin Login</h1>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@pichel.com" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit" id="submit-btn">Sign in</button>
    </form>

    <p class="footer-link"><a href="/">← Back to store</a></p>
  </div>

  <script>
    const API = '';

    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/admin/';
    }

    const form      = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg  = document.getElementById('error-msg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }
    function clearError() {
      errorMsg.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Email and password are required.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Signing in…';

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        if (res.status === 401) { showError('Invalid email or password.'); return; }
        if (!res.ok)             { showError(`Server error (${res.status}). Try again.`); return; }

        const { token } = await res.json();
        localStorage.setItem('token', token);
        window.location.href = '/admin/';

      } catch {
        showError('Could not reach the server. Is the API running?');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign in';
      }
    });
  </script>
</body>
</html>
