server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~ ^/(auth|products|users) {
        proxy_pass         http://host.docker.internal:3000;
        proxy_http_version 1.1;
    }
}
